name: Build Glass Widgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses and Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || BUILD_FAILED=true
          if [ "$BUILD_FAILED" = "true" ]; then
            echo "::error::Gradle assembleDebug failed!"
            FAIL_LOG=$(tail -n 120 build.log)
            echo "$FAIL_LOG"
            gh release edit v1.0 --notes "$FAIL_LOG" || true
            exit 1
          fi

      - name: List Generated APKs
        run: find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassWidgets-debug-apk
          path: "**/*.apk"
          retention-days: 7

      - name: Publish APK to Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          gh release delete-asset v1.0 app-debug.apk -y || true
          gh release upload v1.0 "$APK_PATH" --clobber || \
          gh release create v1.0 "$APK_PATH" --title "Glass Widgets APK v1.0" --notes "Latest build"
          gh release edit v1.0 --notes "Glass Widgets with iOS Frosted Glass Icon Studio & Dock Widget. Built at $(date -u)" || true

